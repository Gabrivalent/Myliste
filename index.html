<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Partite</title>
  
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='110' fill='%231d5fa8'/%3E%3Ccircle cx='256' cy='256' r='160' fill='none' stroke='white' stroke-width='28'/%3E%3C/svg%3E">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#161717">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Partite">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&family=Playfair+Display:ital,wght@0,600;0,700;1,400&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/modals.css">
  <link rel="stylesheet" href="css/responsive.css">

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body class="ro">
<div class="app-layout">

  <!-- SIDEBAR / ICON RAIL (Desktop) & DRAWER (Mobile) -->
  <aside class="app-sidebar" id="appSidebar">
    <div class="sidebar-top">
      <button id="sidebarToggleBtn" class="rail-icon-btn" title="Espandi / Comprimi Menu" type="button">
        <span class="icon">☰</span>
      </button>
      <span class="sidebar-brand-label">Menu Partite</span>
    </div>

    <!-- VISTE ESSENZIALI NELLA RAIL -->
    <nav class="sidebar-nav">
      <button type="button" class="rail-nav-item active" id="railNavHome" title="Partite">
        <span class="icon">🏀</span>
        <span class="label">Partite</span>
      </button>
      <button type="button" class="rail-nav-item" id="railNavResoconto" title="Resoconto Compensi">
        <span class="icon">📊</span>
        <span class="label">Compensi</span>
      </button>
    </nav>

    <!-- ALBERO DEL CALENDARIO: SUBITO IN ALTO -->
    <div class="sidebar-tree-container">
      <div class="sidebar-section-title">Calendario</div>
      <div id="navTree" class="nav-tree"></div>
    </div>

    <!-- IN FONDO: INGRANAGGIO IMPOSTAZIONI TECNICHE, SYNC E LOGIN -->
    <div class="sidebar-bottom">
      <button type="button" class="rail-nav-item" id="railNavSettings" title="Strumenti & Impostazioni">
        <span class="icon">⚙️</span>
        <span class="label">Impostazioni</span>
      </button>

      <div class="rail-sync-wrap" id="railSyncWrap">
        <span id="syncDot" class="sync-dot sync-green" title="Pronto"></span>
        <span class="sync-text-status" id="syncStatusText">Connesso</span>
      </div>

      <button id="authBtn" type="button" class="rail-auth-btn" title="Accesso Amministratore">
        <span class="icon">🔒</span>
        <span class="label">Accedi</span>
      </button>
    </div>
  </aside>

  <!-- BACKDROP MOBILE PER IL DRAWER -->
  <div id="navBackdrop" class="nav-backdrop"></div>

  <!-- AREA PRINCIPALE CONTENUTO -->
  <div class="app-content-wrapper">
    
    <!-- TOP BAR -->
    <header class="top-bar">
      <div class="top-bar-left">
        <button id="mobileMenuBtn" type="button" class="mobile-menu-btn" title="Apri Menu">☰</button>
        <h1 class="page-title">Partite</h1>
        <button id="conflictAlertBtn" type="button" class="alert-btn-standalone status-ok" title="Nessun conflitto">✓</button>
      </div>

      <div class="top-bar-actions">
        <!-- OGGI VICINO A + PARTITA -->
        <button id="todayBtn" type="button" class="pill-btn-action" title="Vai a oggi">Oggi</button>
        <button id="add" type="button" class="btn-primary-action auth-only">+ Partita</button>
        
        <button id="undoBtn" type="button" class="pill-btn-sm auth-only" title="Annulla ultima modifica (Ctrl+Z)">↺</button>
        <button id="quickSaveBtn" class="pill-btn-sm auth-only" title="Salva modifiche (Ctrl+S)">💾</button>
        <button id="quickPullBtn" class="pill-btn-sm" title="Aggiorna dati">↻</button>
      </div>
    </header>

    <!-- STRISCIA FILTRI -->
    <div class="filter-strip">
      <div class="search-wrap">
        <input type="search" id="searchFilter" placeholder="🔍 Cerca squadre, ruoli..." autocomplete="off">
      </div>
      <select id="filterCat"><option value="">Tutte le categorie</option></select>
      <button id="filterIncomplete" type="button" class="filter-chip" aria-pressed="false">Incomplete <span id="incCount"></span></button>
      <button class="waBtn" id="waTodayBtn" type="button" title="Copia turni dei prossimi 7 giorni">📲 WA 7gg</button>
    </div>

    <!-- LISTA GARE & RESOCONTO MENSILE -->
    <main class="content-scroll">
      <div id="list"></div>
    </main>

  </div>
</div>

<!-- BOTTOM BAR MOBILE -->
<nav class="bottom-nav-bar" id="bottomNavBar">
  <button type="button" class="b-nav-item active" id="bNavHome">
    <span class="b-nav-icon">🏀</span>
    <span class="b-nav-label">Gare</span>
  </button>
  <button type="button" class="b-nav-item" id="bNavToday">
    <span class="b-nav-icon">📅</span>
    <span class="b-nav-label">Oggi</span>
  </button>
  <button type="button" class="b-nav-item b-nav-add auth-only" id="bNavAdd" title="Nuova Partita">
    <span class="b-nav-add-icon">+</span>
  </button>
  <button type="button" class="b-nav-item" id="bNavResoconto">
    <span class="b-nav-icon">📊</span>
    <span class="b-nav-label">Compensi</span>
  </button>
  <button type="button" class="b-nav-item" id="bNavAlerts">
    <span class="b-nav-icon" id="bNavAlertIcon">✓</span>
    <span class="b-nav-label">Alert</span>
  </button>
</nav>

<!-- INPUT FILE NASCOSTO PER IMPORT -->
<input type="file" id="importFile" accept="application/json,.json" hidden>
<datalist id="namesList"></datalist>
<datalist id="categoriesList"></datalist>

<!-- TOAST NOTIFICHE -->
<div id="msg" role="status"></div>

<!-- BANNER DI ACCESSO RISERVATO -->
<div class="robanner" id="roBanner">
  <div style="font-size: 32px; margin-bottom: 8px;">🔒</div>
  <h3 style="margin: 0 0 8px; color: var(--ink);">Accesso Riservato</h3>
  <p style="color: var(--mute); margin: 0 0 16px; font-size: 13px;">
    Il calendario e le designazioni dei turni sono private. Effettua l'accesso come amministratore per visualizzare o gestire le partite.
  </p>
  <button type="button" class="primary" onclick="window.handleAuthClick()" style="width: 100%;">
    Accedi con Account
  </button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
